name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: npm ci
      - run: npm run verify:version
      - run: npm run lint
      - run: npm test
      - name: Build and verify web assets
        run: |
          npm run build:android:release
          npm run verify:build
          npx cap sync android
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Resolve release version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          RELEASE_TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Tag must match package.json version"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon
      - name: Sign with persistent release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/finance-release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/finance-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out tui-nho.apk "$RUNNER_TEMP/finance-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs tui-nho.apk
          sha256sum tui-nho.apk > tui-nho.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native APK smoke (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node scripts/android-smoke.mjs tui-nho.apk
      - name: Upload native screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke
          path: artifacts/android-smoke
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; publish a new version instead of replacing binaries."
            exit 1
          fi
          gh release create "$RELEASE_TAG" tui-nho.apk tui-nho.apk.sha256 \
            --target "$GITHUB_SHA" --title "Túi Nhỏ $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --latest
