name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild with the current release harness
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Load current native test harness for historical tags
        if: inputs.release_tag != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/android-smoke.mjs
            scripts/installer-ui.mjs
          sparse-checkout-cone-mode: false
      - name: Select native test harness
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            echo "NATIVE_SMOKE_SCRIPT=.release-tools/scripts/android-smoke.mjs" >> "$GITHUB_ENV"
          else
            echo "NATIVE_SMOKE_SCRIPT=scripts/android-smoke.mjs" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: npm ci
      - run: npm run verify:version
      - run: npm run lint -- --ignore-pattern '.release-tools/**'
      - run: npm test
      - run: node --test scripts/installer-ui.test.mjs
        if: inputs.release_tag == ''
      - name: Build and verify web assets
        run: |
          npm run build:android:release
          npm run verify:build
          npx cap sync android
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Resolve release version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          RELEASE_TAG="v${VERSION}"
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$RELEASE_TAG" ]]; then
            echo "Requested tag must match package.json version"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Tag must match package.json version"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        run: bash gradlew :app:assembleRelease --no-daemon
      - name: Verify compiled launcher resources and build installer QA app
        if: inputs.release_tag == ''
        run: |
          python scripts/verify-apk-icons.py android/app/build/outputs/apk/release/app-release-unsigned.apk "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          cd android
          bash gradlew :installer-probe:assembleDebug --no-daemon
      - name: Sign with persistent release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/finance-release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/finance-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out tui-nho.apk "$RUNNER_TEMP/finance-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs tui-nho.apk
          sha256sum tui-nho.apk > tui-nho.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Package Installer fresh install (API 35)
        timeout-minutes: 15
        if: inputs.release_tag == ''
        uses: reactivecircus/android-emulator-runner@v2
        env:
          INSTALLER_ARTIFACT_DIR: artifacts/installer-api35
          EXPECTED_ANDROID_API: "35"
        with:
          api-level: 35
          avd-name: installer-api35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-spellchecker: true
          disable-animations: true
          script: node scripts/android-installer.mjs tui-nho.apk
      - name: Package Installer fresh install (API 36)
        timeout-minutes: 15
        if: inputs.release_tag == ''
        uses: reactivecircus/android-emulator-runner@v2
        env:
          INSTALLER_ARTIFACT_DIR: artifacts/installer-api36
          EXPECTED_ANDROID_API: "36"
        with:
          api-level: 36
          avd-name: installer-api36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-spellchecker: true
          disable-animations: true
          script: node scripts/android-installer.mjs tui-nho.apk
      - name: Native APK smoke (API 35)
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-spellchecker: true
          disable-animations: true
          script: node "$NATIVE_SMOKE_SCRIPT" tui-nho.apk
      - name: Upload native screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke
          path: |
            artifacts/android-smoke
            artifacts/installer-api*
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; publish a new version instead of replacing binaries."
            exit 1
          fi
          gh release create "$RELEASE_TAG" tui-nho.apk tui-nho.apk.sha256 \
            --target "$RELEASE_SHA" --title "Túi Nhỏ $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --latest
