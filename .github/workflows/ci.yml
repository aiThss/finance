name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:version
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      - run: npm audit --omit=dev
      - run: npx cap sync android
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: npm ci
      - run: npm run verify:version
      - run: npm run build
      - run: npx cap sync android
      - run: bash gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Verify icons in the compiled APK
        run: python scripts/verify-apk-icons.py android/app/build/outputs/apk/debug/app-debug.apk "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native APK smoke (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            node scripts/android-smoke.mjs android/app/build/outputs/apk/debug/app-debug.apk
            node scripts/android-webview-check.mjs
      - name: Upload native screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke
          path: artifacts/android-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: tui-nho-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
